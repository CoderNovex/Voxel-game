<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Unknown — Alien Invasion</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071016;color:#e9f6ff;font-family:system-ui,Segoe UI,sans-serif}
body{display:grid;place-items:center;padding:18px}
#wrap{width:min(100%,1000px)}
header{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:10px}
h1{font-size:22px;margin:0;letter-spacing:.08em}p{margin:4px 0 0;color:#8ea7b8;font-size:13px}
#stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{border:1px solid #254050;border-radius:8px;padding:6px 9px;background:#0c1921;font-size:12px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;background:#0b1419;border:1px solid #284553;border-radius:12px;image-rendering:pixelated;box-shadow:0 12px 35px #0008}
#hint{margin-top:9px;color:#9db2bf;font-size:12px;line-height:1.5}
kbd{background:#10232d;border:1px solid #34515f;border-radius:5px;padding:2px 5px;color:#fff}
</style>
</head>
<body>
<div id="wrap">
<header>
  <div><h1>📡 SIGNAL: UNKNOWN</h1><p>A tiny 2D alien-invasion prototype</p></div>
  <div id="stats"><span class="badge">HP <b id="hp">100</b></span><span class="badge">SIGNALS <b id="signals">0/3</b></span><span class="badge">ALIENS <b id="aliens">0</b></span></div>
</header>
<canvas id="game" width="960" height="600" aria-label="2D alien invasion game"></canvas>
<div id="hint"><kbd>WASD</kbd>/<kbd>Arrow keys</kbd> move · <kbd>Mouse</kbd> aim · <kbd>Click</kbd> fire · Reach all 3 signal beacons · Avoid the aliens</div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const tileImgs=[];
for(let i=0;i<10;i++){const im=new Image();im.src='assets/tile_000'+i+'.png';tileImgs.push(im)}
const keys=new Set(), mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase()); if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
canvas.addEventListener('pointerdown',()=>mouse.down=true);
addEventListener('pointerup',()=>mouse.down=false);

const player={x:W/2,y:H/2,r:12,hp:100,cool:0};
const signals=[{x:135,y:115,got:false},{x:815,y:145,got:false},{x:760,y:490,got:false}];
let bullets=[], enemies=[], particles=[], score=0, gameOver=false, won=false, spawnTimer=0;

function rnd(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawnAlien(){
  const side=Math.floor(Math.random()*4), p=side===0?{x:-20,y:rnd(20,H-20)}:side===1?{x:W+20,y:rnd(20,H-20)}:side===2?{x:rnd(20,W-20),y:-20}:{x:rnd(20,W-20),y:H+20};
  enemies.push({x:p.x,y:p.y,r:12,speed:rnd(0.65,1.05),hp:2});
}
function burst(x,y,n=8){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-2,2),vy:rnd(-2,2),life:rnd(15,30)});
}
function fire(){
  if(player.cool>0||gameOver||won)return;
  const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  bullets.push({x:player.x+Math.cos(a)*16,y:player.y+Math.sin(a)*16,vx:Math.cos(a)*7,vy:Math.sin(a)*7,life:80});
  player.cool=12;
}
function update(){
  if(gameOver||won)return;
  let dx=0,dy=0;
  if(keys.has('w')||keys.has('arrowup'))dy--; if(keys.has('s')||keys.has('arrowdown'))dy++;
  if(keys.has('a')||keys.has('arrowleft'))dx--; if(keys.has('d')||keys.has('arrowright'))dx++;
  if(dx||dy){const l=Math.hypot(dx,dy);player.x+=dx/l*3;player.y+=dy/l*3}
  player.x=Math.max(18,Math.min(W-18,player.x));player.y=Math.max(18,Math.min(H-18,player.y));
  if(mouse.down)fire(); if(player.cool>0)player.cool--;
  spawnTimer--; if(spawnTimer<=0){spawnAlien();spawnTimer=Math.max(28,80-score*2)}
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--});
  bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  enemies.forEach(e=>{
    const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed;e.y+=Math.sin(a)*e.speed;
    if(dist(e,player)<e.r+player.r){player.hp-=0.35;burst(player.x,player.y,1)}
  });
  for(const b of bullets){
    for(const e of enemies){
      if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp--;b.life=0;burst(e.x,e.y,4);if(e.hp<=0)score++}
    }
  }
  enemies=enemies.filter(e=>e.hp>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0);
  signals.forEach(s=>{if(!s.got&&dist(s,player)<28){s.got=true;score+=5;burst(s.x,s.y,18)}});
  if(signals.every(s=>s.got))won=true;
  if(player.hp<=0)gameOver=true;
  document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));
  document.getElementById('signals').textContent=signals.filter(s=>s.got).length+'/3';
  document.getElementById('aliens').textContent=enemies.length;
}
function drawTile(x,y,i,size=32){
  const im=tileImgs[i%tileImgs.length];
  if(im.complete&&im.naturalWidth){ctx.drawImage(im,x,y,size,size)}
  else {ctx.fillStyle=i%2?'#182a22':'#20332a';ctx.fillRect(x,y,size,size)}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a1615';ctx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=32)for(let x=0;x<W;x+=32)drawTile(x,y,(x/32+y/32)%10,32);
  ctx.fillStyle='rgba(5,10,14,.28)';ctx.fillRect(0,0,W,H);
  // city blocks
  for(let i=0;i<7;i++){let x=55+i*125,y=255+(i%2)*38;ctx.fillStyle='#17262e';ctx.fillRect(x,y,92,55);ctx.strokeStyle='#304b57';ctx.strokeRect(x,y,92,55)}
  // signals
  signals.forEach(s=>{
    ctx.beginPath();ctx.arc(s.x,s.y,26,0,Math.PI*2);ctx.strokeStyle=s.got?'#78909c':'#67e8f9';ctx.globalAlpha=.25+.15*Math.sin(performance.now()/150);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=s.got?'#78909c':'#67e8f9';ctx.fillRect(s.x-5,s.y-5,10,10);
    ctx.fillStyle='#c7f9ff';ctx.font='11px monospace';ctx.fillText(s.got?'SYNCED':'SIGNAL',s.x-22,s.y-34);
  });
  // player
  const pa=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(pa);ctx.fillStyle='#e8f1f5';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4fd1c5';ctx.fillRect(7,-4,12,8);ctx.restore();
  // aliens
  enemies.forEach(e=>{
    ctx.fillStyle='#9cff57';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#071016';ctx.beginPath();ctx.arc(e.x-4,e.y-2,2.2,0,Math.PI*2);ctx.arc(e.x+4,e.y-2,2.2,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#9cff57';ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  });
  // bullets
  ctx.fillStyle='#fff4a8';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill()});
  particles.forEach(p=>{ctx.globalAlpha=p.life/30;ctx.fillStyle='#b8f7ff';ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
  if(gameOver||won){
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 36px system-ui';
    ctx.fillText(won?'SIGNAL LOCKED':'SIGNAL LOST',W/2,H/2-18);
    ctx.font='16px system-ui';ctx.fillStyle='#a9c1cc';
    ctx.fillText(won?'You found all three transmission points.':'The aliens overwhelmed the area.',W/2,H/2+16);
    ctx.fillText('Press R to restart',W/2,H/2+50);ctx.textAlign='left';
  }
}
function reset(){
  player.x=W/2;player.y=H/2;player.hp=100;bullets=[];enemies=[];particles=[];score=0;spawnTimer=10;gameOver=false;won=false;
  signals.forEach(s=>s.got=false);
}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&(gameOver||won))reset()});
function loop(){update();draw();requestAnimationFrame(loop)} loop();
})();
</script>
</body>
</html>
